<script type="module">
import {
  watchAuthState, login, registerTrainee, logout,
  fsGet, fsSet, fsDelete, fsListAll,
  uploadPhoto, uploadThemeSong, createStaffAccount
} from './firebase-client.js';

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function fmtDate(ts){ if(!ts) return ''; try{ return new Date(ts).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }catch(e){ return ''; } }
function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

/* Maps Firebase Auth error codes to plain-language messages. */
function friendlyAuthError(err){
  const code = (err && err.code) || '';
  const map = {
    'auth/email-already-in-use': 'That email is already registered.',
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/weak-password': 'Password must be at least 6 characters.',
    'auth/invalid-credential': 'Incorrect email or password.',
    'auth/user-not-found': 'Incorrect email or password.',
    'auth/wrong-password': 'Incorrect email or password.',
    'auth/too-many-requests': 'Too many attempts. Try again in a bit.',
  };
  if(map[code]) return map[code];
  if(err && err.message) return err.message.replace(/^Firebase:\s*/,'').replace(/\s*\(auth\/[^)]+\)\.?$/,'');
  return 'Something went wrong. Try again.';
}

/* ---------------- session state ---------------- */
let session = null;      // {uid, username, role, email}
let authMode = 'login';  // 'login' | 'register'
let authError = '';
let regError = '';
let trainerCreateMsg = {ok:false, text:''};
let profileDraft = null; // working copy while editing
let profileMode = 'view'; // 'view' | 'edit'
let saveMsg = '';

let rosterQuery = '';
let rosterAlignment = 'all';
let rosterProfiles = [];   // cached {uid, username, profile}
let rosterDetail = null;   // uid currently open in detail
let adminUsers = [];

const ARCHETYPES = ['Monster','Technician','High-Flyer','Brawler','Powerhouse','Showman/Showwoman','Underdog','Rule-Breaker','Veteran','Other'];

function blankProfile(){
  return {
    ringName:'', realName:'', nicknames:'', hometown:'', height:'', weight:'',
    alignment:'Face',
    photo:null,
    ringAttire:'', casualAttire:'',
    archetype:'Technician', archetypeOther:'',
    personality:'', catchphrases:'',
    themeSong:'', entranceDescription:'', themeSongUrl:null, themeSongName:'',
    sigMoves:['','','','',''],
    finisherName:'', finisherDesc:'',
    weaponsMatchTypes:'',
    biography:'', alliesRivals:'',
    updatedAt:null
  };
}

/* ---------------- app init ---------------- */
function init(){
  renderAuth(); // show something immediately while Firebase resolves auth state
  watchAuthState(async (user)=>{
    if(!user){
      session = null;
      renderAuth();
      return;
    }
    if(session && session.uid === user.uid) return; // already handled by an explicit login/register flow
    const userDoc = await fsGet('users', user.uid);
    if(!userDoc){
      // Auth account exists with no matching account record -- treat as signed out.
      await logout();
      session = null;
      renderAuth();
      return;
    }
    session = {uid: user.uid, username: userDoc.username, role: userDoc.role, email: userDoc.email};
    routeToHome();
  });
}

/* ---------------- render: shell pieces ---------------- */
function navBar(active){
  const roleLabel = session.role === 'admin' ? 'Admin' : (session.role === 'trainer' ? 'Trainer' : 'Trainee');
  const roleColor = session.role === 'admin' ? 'var(--gold)' : (session.role === 'trainer' ? 'var(--blue)' : 'var(--amber)');
  let tabs = '';
  if(session.role === 'trainee'){
    tabs = `<button class="wtc-navtab ${active==='profile'?'active':''}" data-nav="profile">My profile</button>`;
  } else {
    tabs = `<button class="wtc-navtab ${active==='roster'?'active':''}" data-nav="roster">Roster</button>`;
    if(session.role === 'admin'){
      tabs += `<button class="wtc-navtab ${active==='accounts'?'active':''}" data-nav="accounts">Accounts</button>`;
    }
  }
  return `
  <div class="wtc-nav">
    <div class="wtc-nav-brand">
      <span class="wtc-nav-brand-main">WRESTLING TRAINEE CHARACTER MANAGER</span>
      <span class="wtc-nav-brand-sub">Locker Room Roster</span>
    </div>
    <div class="wtc-nav-tabs">${tabs}</div>
    <div class="wtc-nav-user">
      <span class="wtc-role-chip" style="--chip:${roleColor}">${esc(roleLabel)}</span>
      <span class="wtc-nav-username">${esc(session.username)}</span>
      <button class="wtc-btn wtc-btn-ghost" id="wtc-logout">Log out</button>
    </div>
  </div>`;
}

/* ---------------- AUTH SCREEN ---------------- */
function renderAuth(){
  const app = document.getElementById('wtc-app');
  app.innerHTML = `
  ${styleBlock()}
  <div class="wtc-hero">
    <h1>WRESTLING TRAINEE CHARACTER MANAGER</h1>
  </div>
  <div class="wtc-auth-wrap">
    <div class="wtc-authtabs">
      <button class="wtc-authtab ${authMode==='login'?'active':''}" data-auth="login">Log in</button>
      <button class="wtc-authtab ${authMode==='register'?'active':''}" data-auth="register">Create trainee account</button>
    </div>
    <div class="wtc-card">
      ${authMode==='login' ? renderLoginForm() : renderRegisterForm()}
    </div>
    <div class="wtc-demo-note">
      There are three account types: trainee, trainer, and admin. Trainee accounts are self-serve here. Trainer and admin accounts can only be created by an existing admin, from the Accounts tab.
      <br><br>Sign in with your email address. Trainee profiles are private &mdash; only you and your trainers/admins can see them, enforced by the backend, not just by this page.
    </div>
  </div>`;

  document.querySelectorAll('[data-auth]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ authMode = btn.dataset.auth; authError=''; regError=''; renderAuth(); });
  });
  wireAuthForms();
}

function renderLoginForm(){
  return `
  ${authError ? `<div class="wtc-error">${esc(authError)}</div>` : ''}
  <form id="wtc-login-form">
    <div class="wtc-field"><label>Email</label><input type="email" id="wtc-login-email" autocomplete="username" required></div>
    <div class="wtc-field"><label>Password</label><input type="password" id="wtc-login-pass" autocomplete="current-password" required></div>
    <button type="submit" class="wtc-btn" style="width:100%">Log in</button>
  </form>`;
}
function contactFieldsHtml(prefix, v){
  v = v || {};
  const social = v.social || ['','',''];
  return `
    <div class="wtc-field"><label>Email</label><input type="email" id="${prefix}-email" value="${esc(v.email||'')}" required></div>
    <div class="wtc-field"><label>Phone number <span class="wtc-hint">&mdash; optional</span></label><input type="text" id="${prefix}-phone" value="${esc(v.phone||'')}"></div>
    <div class="wtc-field"><label>Social media links <span class="wtc-hint">&mdash; up to 3, optional</span></label>
      <input type="text" id="${prefix}-social1" placeholder="https://instagram.com/yourhandle" value="${esc(social[0]||'')}" style="margin-bottom:8px;">
      <input type="text" id="${prefix}-social2" placeholder="https://twitter.com/yourhandle" value="${esc(social[1]||'')}" style="margin-bottom:8px;">
      <input type="text" id="${prefix}-social3" placeholder="https://tiktok.com/@yourhandle" value="${esc(social[2]||'')}">
    </div>`;
}
function readContactFields(prefix){
  return {
    email: document.getElementById(prefix+'-email').value.trim(),
    phone: document.getElementById(prefix+'-phone').value.trim(),
    social: [
      document.getElementById(prefix+'-social1').value.trim(),
      document.getElementById(prefix+'-social2').value.trim(),
      document.getElementById(prefix+'-social3').value.trim()
    ].filter(Boolean)
  };
}

function renderRegisterForm(){
  return `
  ${regError ? `<div class="wtc-error">${esc(regError)}</div>` : ''}
  <div class="wtc-note" style="margin-bottom:14px;">This creates a trainee account. Trainee profiles are private &mdash; only you and your trainers/admins can see them. You'll log in with your email.</div>
  <form id="wtc-register-form">
    <div class="wtc-field"><label>Choose a display name</label><input type="text" id="wtc-reg-user" required></div>
    <div class="wtc-field"><label>Choose a password</label><input type="password" id="wtc-reg-pass" required></div>
    <div class="wtc-field"><label>Confirm password</label><input type="password" id="wtc-reg-pass2" required></div>
    ${contactFieldsHtml('wtc-reg')}
    <button type="submit" class="wtc-btn" style="width:100%">Create trainee account</button>
  </form>`;
}

function wireAuthForms(){
  const loginForm = document.getElementById('wtc-login-form');
  if(loginForm){
    loginForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const email = document.getElementById('wtc-login-email').value.trim();
      const pass = document.getElementById('wtc-login-pass').value;
      try{
        const user = await login(email, pass);
        const userDoc = await fsGet('users', user.uid);
        if(!userDoc){
          authError = 'No account record found for this login.';
          renderAuth();
          return;
        }
        session = {uid: user.uid, username: userDoc.username, role: userDoc.role, email: userDoc.email};
        authError = '';
        routeToHome();
      }catch(err){
        authError = friendlyAuthError(err);
        renderAuth();
      }
    });
  }
  const regForm = document.getElementById('wtc-register-form');
  if(regForm){
    regForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const username = document.getElementById('wtc-reg-user').value.trim();
      const pass = document.getElementById('wtc-reg-pass').value;
      const pass2 = document.getElementById('wtc-reg-pass2').value;
      if(username.length < 2){ regError = 'Enter a display name.'; renderAuth(); return; }
      if(pass.length < 6){ regError = 'Password must be at least 6 characters.'; renderAuth(); return; }
      if(pass !== pass2){ regError = 'Passwords do not match.'; renderAuth(); return; }
      const contact = readContactFields('wtc-reg');
      if(!validEmail(contact.email)){ regError = 'Enter a valid email address.'; renderAuth(); return; }
      try{
        const user = await registerTrainee(contact.email, pass);
        const userDoc = {username, email: contact.email, phone: contact.phone, social: contact.social, role:'trainee', createdAt: Date.now()};
        await fsSet('users', user.uid, userDoc);
        session = {uid: user.uid, username, role:'trainee', email: contact.email};
        regError = '';
        routeToHome();
      }catch(err){
        regError = friendlyAuthError(err);
        renderAuth();
      }
    });
  }
}

function routeToHome(){
  if(session.role === 'trainee'){ renderTraineeScreen(); }
  else { renderRosterScreen(); }
}

function wireNav(active){
  document.getElementById('wtc-logout').addEventListener('click', async ()=>{
    await logout();
    session = null; profileDraft=null; profileMode='view'; rosterDetail=null;
    renderAuth();
  });
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = btn.dataset.nav;
      if(target==='profile') renderTraineeScreen();
      else if(target==='roster') renderRosterScreen();
      else if(target==='accounts') renderAccountsScreen();
    });
  });
}

/* ---------------- TRAINEE SCREEN ---------------- */
async function renderTraineeScreen(){
  const app = document.getElementById('wtc-app');
  const existing = await fsGet('profiles', session.uid);
  if(!existing){ profileMode = 'edit'; profileDraft = blankProfile(); }
  else if(!profileDraft){ profileDraft = JSON.parse(JSON.stringify(existing)); }

  app.innerHTML = `${styleBlock()}${navBar('profile')}
  <div id="wtc-trainee-body"></div>`;
  wireNav('profile');

  const body = document.getElementById('wtc-trainee-body');
  if(profileMode === 'view' && existing){
    body.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h2 style="font-family:var(--font-display);letter-spacing:.5px;margin:0;color:var(--canvas);">Your character card</h2>
        <button class="wtc-btn" id="wtc-edit-btn">Edit profile</button>
      </div>
      ${renderProfileCard(existing)}
    `;
    document.getElementById('wtc-edit-btn').addEventListener('click', ()=>{
      profileDraft = JSON.parse(JSON.stringify(existing));
      profileMode='edit'; saveMsg='';
      renderTraineeScreen();
    });
  } else {
    body.innerHTML = `
      <h2 style="font-family:var(--font-display);letter-spacing:.5px;margin:0 0 16px;color:var(--canvas);">
        ${existing ? 'Edit your character' : 'Build your character'}
      </h2>
      ${renderProfileForm(existing)}
    `;
    wireProfileForm(existing);
  }
}

function alignmentBadgeClass(a){
  if(a==='Heel') return 'wtc-align-heel';
  if(a==='Tweener') return 'wtc-align-tweener';
  return 'wtc-align-face';
}
function alignmentMeaning(a){
  if(a==='Heel') return 'Heel &middot; plays the villain';
  if(a==='Tweener') return 'Tweener &middot; neutral, swings either way';
  return 'Face &middot; plays the hero';
}

function wireProfileForm(existing){
  const archSel = document.getElementById('f-archetype');
  archSel.addEventListener('change', ()=>{
    document.getElementById('f-archetypeOther-wrap').style.display = archSel.value==='Other' ? '' : 'none';
  });

  const photoInput = document.getElementById('f-photo');
  photoInput.addEventListener('change', async ()=>{
    const errEl = document.getElementById('f-photo-error');
    errEl.innerHTML = '';
    const file = photoInput.files[0];
    if(!file) return;
    if(file.size > 5*1024*1024){
      errEl.innerHTML = '<div class="wtc-error" style="margin-top:8px;">That image is over 5MB. Choose a smaller file.</div>';
      photoInput.value='';
      return;
    }
    if(!file.type.startsWith('image/')){
      errEl.innerHTML = '<div class="wtc-error" style="margin-top:8px;">Please upload an image file.</div>';
      photoInput.value='';
      return;
    }
    document.getElementById('f-photo-preview').innerHTML = '<div class="wtc-tag">Uploading&hellip;</div>';
    try{
      const url = await uploadPhoto(session.uid, file);
      profileDraft.photo = url;
      document.getElementById('f-photo-preview').innerHTML = `<img src="${url}" style="width:100%;border-radius:6px;border:2px solid var(--line);">`;
    }catch(err){
      errEl.innerHTML = `<div class="wtc-error" style="margin-top:8px;">${esc(err.message || 'Could not upload that image.')}</div>`;
      document.getElementById('f-photo-preview').innerHTML = '';
    }
  });

  const themeSongInput = document.getElementById('f-themeSongFile');
  themeSongInput.addEventListener('change', async ()=>{
    const errEl = document.getElementById('f-themeSong-error');
    errEl.innerHTML = '';
    const file = themeSongInput.files[0];
    if(!file) return;
    if(file.size > 10*1024*1024){
      errEl.innerHTML = '<div class="wtc-error" style="margin-top:8px;">That file is over 10MB. Choose a smaller file.</div>';
      themeSongInput.value='';
      return;
    }
    if(!file.type.startsWith('audio/')){
      errEl.innerHTML = '<div class="wtc-error" style="margin-top:8px;">Please upload an audio file.</div>';
      themeSongInput.value='';
      return;
    }
    document.getElementById('f-themeSong-preview').innerHTML = '<div class="wtc-tag">Uploading&hellip;</div>';
    try{
      const url = await uploadThemeSong(session.uid, file);
      profileDraft.themeSongUrl = url;
      profileDraft.themeSongName = file.name;
      document.getElementById('f-themeSong-preview').innerHTML =
        `<div class="wtc-tag">Selected: ${esc(file.name)}</div>
         <audio controls style="width:100%;max-width:320px;margin-top:6px;" src="${url}"></audio>`;
    }catch(err){
      errEl.innerHTML = `<div class="wtc-error" style="margin-top:8px;">${esc(err.message || 'Could not upload that file.')}</div>`;
      document.getElementById('f-themeSong-preview').innerHTML = '';
    }
  });
  const themeRemoveBtn = document.getElementById('f-themeSong-remove');
  if(themeRemoveBtn){
    themeRemoveBtn.addEventListener('click', ()=>{
      profileDraft.themeSongUrl = null;
      profileDraft.themeSongName = '';
      document.getElementById('f-themeSong-preview').innerHTML = '<div class="wtc-tag">Theme song file removed.</div>';
    });
  }

  const cancelBtn = document.getElementById('wtc-cancel-edit');
  if(cancelBtn){
    cancelBtn.addEventListener('click', ()=>{
      profileMode='view'; profileDraft=null; saveMsg='';
      renderTraineeScreen();
    });
  }

  document.getElementById('wtc-profile-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errBox = document.getElementById('wtc-form-error');
    errBox.innerHTML='';

    const sigMoves = Array.from(document.querySelectorAll('.f-sigMove')).map(i=>i.value.trim());
    const filledMoves = sigMoves.filter(Boolean);
    if(filledMoves.length < 3){
      errBox.innerHTML = `<div class="wtc-error">Add at least 3 signature moves.</div>`;
      return;
    }
    const ringName = document.getElementById('f-ringName').value.trim();
    const finisherName = document.getElementById('f-finisherName').value.trim();
    if(!ringName || !finisherName){
      errBox.innerHTML = `<div class="wtc-error">Ring name and finishing move name are required.</div>`;
      return;
    }

    const updated = {
      ringName,
      realName: document.getElementById('f-realName').value.trim(),
      nicknames: document.getElementById('f-nicknames').value.trim(),
      hometown: document.getElementById('f-hometown').value.trim(),
      height: document.getElementById('f-height').value.trim(),
      weight: document.getElementById('f-weight').value.trim(),
      alignment: document.getElementById('f-alignment').value,
      photo: profileDraft.photo || null,
      ringAttire: document.getElementById('f-ringAttire').value.trim(),
      casualAttire: document.getElementById('f-casualAttire').value.trim(),
      archetype: document.getElementById('f-archetype').value,
      archetypeOther: document.getElementById('f-archetypeOther') ? document.getElementById('f-archetypeOther').value.trim() : '',
      personality: document.getElementById('f-personality').value.trim(),
      catchphrases: document.getElementById('f-catchphrases').value.trim(),
      themeSong: document.getElementById('f-themeSong').value.trim(),
      themeSongUrl: profileDraft.themeSongUrl || null,
      themeSongName: profileDraft.themeSongName || '',
      entranceDescription: document.getElementById('f-entranceDescription').value.trim(),
      sigMoves,
      finisherName,
      finisherDesc: document.getElementById('f-finisherDesc').value.trim(),
      weaponsMatchTypes: document.getElementById('f-weaponsMatchTypes').value.trim(),
      biography: document.getElementById('f-biography').value.trim(),
      alliesRivals: document.getElementById('f-alliesRivals').value.trim(),
      username: session.username,
      updatedAt: Date.now()
    };

    let ok = true;
    try{
      await fsSet('profiles', session.uid, updated);
    }catch(err){
      ok = false;
      errBox.innerHTML = `<div class="wtc-error">${esc(err.message || 'Could not save right now. Try again.')}</div>`;
    }
    if(!ok) return;
    profileMode='view'; profileDraft=null; saveMsg='Profile saved.';
    renderTraineeScreen();
  });
}

/* ---------------- ROSTER SCREEN (trainer + admin) ---------------- */
async function loadRoster(){
  const docs = await fsListAll('profiles');
  const list = docs.map(d => ({ uid: d.id, username: d.username || d.id, profile: d }));
  list.sort((a,b)=> (a.profile.ringName||a.username).localeCompare(b.profile.ringName||b.username));
  rosterProfiles = list;
}

async function renderRosterScreen(){
  const app = document.getElementById('wtc-app');
  app.innerHTML = `${styleBlock()}${navBar('roster')}
  <div id="wtc-roster-body"><div class="wtc-note">Loading roster&hellip;</div></div>`;
  wireNav('roster');
  await loadRoster();
  drawRoster();
}

function drawRoster(){
  const body = document.getElementById('wtc-roster-body');
  const filtered = rosterProfiles.filter(r=>{
    const matchesQuery = !rosterQuery || (
      (r.profile.ringName||'').toLowerCase().includes(rosterQuery) ||
      (r.username||'').toLowerCase().includes(rosterQuery) ||
      (r.profile.hometown||'').toLowerCase().includes(rosterQuery) ||
      (r.profile.archetype||'').toLowerCase().includes(rosterQuery)
    );
    const matchesAlign = rosterAlignment==='all' || r.profile.alignment === rosterAlignment;
    return matchesQuery && matchesAlign;
  });

  body.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <h2 style="font-family:var(--font-display);letter-spacing:.5px;margin:0;color:var(--canvas);">Trainee roster</h2>
      <span class="wtc-note">${rosterProfiles.length} character${rosterProfiles.length===1?'':'s'} on file</span>
    </div>
    <div class="wtc-roster-toolbar">
      <input type="text" id="wtc-roster-search" placeholder="Search ring name, hometown, archetype, or name" value="${esc(rosterQuery)}">
      <select id="wtc-roster-align">
        <option value="all" ${rosterAlignment==='all'?'selected':''}>All alignments</option>
        <option value="Face" ${rosterAlignment==='Face'?'selected':''}>Face</option>
        <option value="Heel" ${rosterAlignment==='Heel'?'selected':''}>Heel</option>
        <option value="Tweener" ${rosterAlignment==='Tweener'?'selected':''}>Tweener</option>
      </select>
    </div>
    ${filtered.length ? `<div class="wtc-roster-grid">${filtered.map(r=>rosterMiniCard(r)).join('')}</div>` : `<div class="wtc-empty">No characters match. Adjust the search or filter.</div>`}
    ${rosterDetail ? rosterDetailModal(rosterDetail) : ''}
  `;

  document.getElementById('wtc-roster-search').addEventListener('input', (e)=>{
    rosterQuery = e.target.value.toLowerCase();
    drawRoster();
    document.getElementById('wtc-roster-search').focus();
    const el = document.getElementById('wtc-roster-search'); el.selectionStart = el.selectionEnd = el.value.length;
  });
  document.getElementById('wtc-roster-align').addEventListener('change', (e)=>{
    rosterAlignment = e.target.value;
    drawRoster();
  });
  document.querySelectorAll('[data-open-detail]').forEach(el=>{
    el.addEventListener('click', ()=>{ rosterDetail = el.dataset.openDetail; drawRoster(); });
  });
  const closeBtn = document.getElementById('wtc-modal-close');
  if(closeBtn){
    closeBtn.addEventListener('click', ()=>{ rosterDetail=null; drawRoster(); });
    document.getElementById('wtc-modal-backdrop').addEventListener('click', (e)=>{
      if(e.target.id==='wtc-modal-backdrop'){ rosterDetail=null; drawRoster(); }
    });
  }
}

function rosterMiniCard(r){
  const p = r.profile;
  const photoHtml = p.photo ? `<img src="${p.photo}" alt="">` : 'No photo';
  return `
  <div class="wtc-mini-card" data-open-detail="${esc(r.uid)}">
    <div class="wtc-mini-photo">${photoHtml}</div>
    <p class="wtc-mini-name">${esc(p.ringName)||'Unnamed'}</p>
    <div class="wtc-mini-meta">${esc(p.archetype==='Other'?p.archetypeOther:p.archetype)||'&mdash;'} &middot; ${esc(p.alignment)}</div>
    <div class="wtc-mini-meta">${esc(p.hometown)||'&mdash;'}</div>
  </div>`;
}

function rosterDetailModal(uid){
  const r = rosterProfiles.find(x=>x.uid===uid);
  if(!r) return '';
  return `
  <div class="wtc-modal-backdrop" id="wtc-modal-backdrop">
    <div class="wtc-modal">
      <button class="wtc-modal-close" id="wtc-modal-close" aria-label="Close">&times;</button>
      <div class="wtc-note" style="color:var(--muted);margin-bottom:10px;">Trainee: ${esc(r.username)}</div>
      ${renderProfileCard(r.profile)}
    </div>
  </div>`;
}

/* ---------------- ADMIN: ACCOUNTS SCREEN ---------------- */
async function loadUsers(){
  const docs = await fsListAll('users');
  docs.sort((a,b)=> (a.username||'').localeCompare(b.username||''));
  adminUsers = docs;
}

async function renderAccountsScreen(){
  const app = document.getElementById('wtc-app');
  app.innerHTML = `${styleBlock()}${navBar('accounts')}
  <div id="wtc-accounts-body"><div class="wtc-note">Loading accounts&hellip;</div></div>`;
  wireNav('accounts');
  await loadUsers();
  drawAccounts();
}

function contactCellHtml(u){
  const social = (u.social||[]).filter(Boolean);
  return `
    <div style="font-size:12.5px;">${esc(u.email)||'&mdash;'}</div>
    ${u.phone ? `<div class="wtc-tag">${esc(u.phone)}</div>` : ''}
    ${social.length ? `<div style="display:flex;flex-direction:column;gap:2px;margin-top:4px;">
      ${social.map(s=>`<a href="${esc(s)}" target="_blank" rel="noopener" style="font-size:11px;">${esc(s)}</a>`).join('')}
    </div>` : ''}
  `;
}

function roleBadge(role){
  const color = role==='admin' ? 'var(--gold)' : (role==='trainer' ? 'var(--blue)' : 'var(--amber)');
  return `<span class="wtc-role-chip" style="--chip:${color}">${esc(role)}</span>`;
}

function drawAccounts(){
  const body = document.getElementById('wtc-accounts-body');
  body.innerHTML = `
    <h2 style="font-family:var(--font-display);letter-spacing:.5px;margin:0 0 16px;color:var(--canvas);">Accounts</h2>

    <div class="wtc-card" style="margin-bottom:18px;">
      <h3 class="wtc-section-title">Create a staff account</h3>
      <div class="wtc-note" style="margin-bottom:12px;">There are three account types. Trainees self-register. Trainer and admin accounts can only be created here, by an existing admin. Trainers can browse every trainee profile; admins can additionally manage accounts.</div>
      ${trainerCreateMsg.text ? `<div class="${trainerCreateMsg.ok?'wtc-success':'wtc-error'}">${esc(trainerCreateMsg.text)}</div>` : ''}
      <form id="wtc-trainer-form">
        <div class="wtc-row3">
          <div class="wtc-field"><label>Display name</label><input type="text" id="wtc-tr-user" required></div>
          <div class="wtc-field"><label>Temporary password</label><input type="text" id="wtc-tr-pass" required></div>
          <div class="wtc-field">
            <label>Role</label>
            <select id="wtc-tr-role">
              <option value="trainer">Trainer</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>
        <div class="wtc-row2">
          ${contactFieldsHtml('wtc-tr')}
        </div>
        <button type="submit" class="wtc-btn">Create account</button>
      </form>
    </div>

    <div class="wtc-card">
      <h3 class="wtc-section-title">All accounts (${adminUsers.length})</h3>
      <div style="overflow-x:auto;">
      <table class="wtc-table">
        <thead><tr><th>Name</th><th>Role</th><th>Contact</th><th>Created</th><th></th></tr></thead>
        <tbody>
          ${adminUsers.map(u=>`
            <tr>
              <td>${esc(u.username)}</td>
              <td>${roleBadge(u.role)}</td>
              <td>${contactCellHtml(u)}</td>
              <td>${fmtDate(u.createdAt)}</td>
              <td>
                ${u.id === session.uid ? '<span class="wtc-tag">You</span>' :
                  `<button class="wtc-btn wtc-btn-ghost wtc-btn-sm" data-delete-user="${esc(u.id)}" data-delete-name="${esc(u.username)}">Remove</button>`}
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;

  document.getElementById('wtc-trainer-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const username = document.getElementById('wtc-tr-user').value.trim();
    const pass = document.getElementById('wtc-tr-pass').value;
    const role = document.getElementById('wtc-tr-role').value;
    if(username.length < 2){
      trainerCreateMsg = {ok:false, text:'Enter a display name.'};
      drawAccounts(); return;
    }
    if(pass.length < 6){
      trainerCreateMsg = {ok:false, text:'Password must be at least 6 characters.'};
      drawAccounts(); return;
    }
    const contact = readContactFields('wtc-tr');
    if(!validEmail(contact.email)){
      trainerCreateMsg = {ok:false, text:'Enter a valid email address.'};
      drawAccounts(); return;
    }
    try{
      await createStaffAccount({ email: contact.email, password: pass, username, phone: contact.phone, social: contact.social, role });
      trainerCreateMsg = {ok:true, text:`${role==='admin'?'Admin':'Trainer'} account "${username}" created.`};
      await loadUsers();
      drawAccounts();
    }catch(err){
      trainerCreateMsg = {ok:false, text: err.message || 'Could not create that account.'};
      drawAccounts();
    }
  });

  document.querySelectorAll('[data-delete-user]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const uid = btn.dataset.deleteUser;
      const name = btn.dataset.deleteName;
      if(!confirm(`Remove the account "${name}"? This revokes their access immediately. Their login itself isn't deleted -- extend the backend if you also want that.`)) return;
      await fsDelete('users', uid);
      await fsDelete('profiles', uid);
      await loadUsers();
      trainerCreateMsg = {ok:true, text:`Account "${name}" removed.`};
      drawAccounts();
    });
  });
}

init();
</script>
